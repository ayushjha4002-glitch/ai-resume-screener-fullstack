<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume Screener</title>

<!-- Fonts (optional, purely visual) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

<!--
  ====== THE 3 SCRIPTS BELOW ARE THE WHOLE "SETUP" ======
  React + ReactDOM: give us React itself (no npm install needed).
  Babel: lets the browser understand JSX (the <div>-in-JavaScript syntax)
  without a build step. It's a bit slower than a real build tool, which
  is why this only makes sense for a small project like this one.
-->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --bg: #f2f1eb;
    --surface: #ffffff;
    --surface-sunken: #eae8de;
    --ink: #171b24;
    --ink-muted: #5c6272;
    --ink-faint: #9297a3;
    --border: #e0ddd0;
    --border-strong: #c8c4b3;
    --brand: #2b3a67;
    --brand-strong: #1c2748;
    --brand-tint: #e8eaf2;
    --good: #2f9e63; --good-bg: #e5f4ec;
    --mid: #b8860f;  --mid-bg: #faf1dc;
    --bad: #c1443c;  --bad-bg: #fbeae8;
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
  button { font-family: var(--font-body); cursor: pointer; }
  .mono { font-family: var(--font-mono); }

  .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { padding: 24px clamp(16px,4vw,40px); border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .topbar__mark { width: 12px; height: 12px; border-radius: 3px; background: var(--brand); transform: rotate(45deg); }
  .topbar h1 { font-size: 21px; display: inline-block; margin-left: 8px; }
  .topbar__tag { color: var(--ink-muted); font-size: 13.5px; }

  .workspace { flex: 1; display: grid; grid-template-columns: 320px minmax(0,1fr) 340px; gap: 1px; background: var(--border); }
  @media (max-width: 1060px) { .workspace { grid-template-columns: 300px minmax(0,1fr); } .detail-panel { display: none; } }
  @media (max-width: 720px) { .workspace { grid-template-columns: 1fr; } }

  .panel { background: var(--bg); padding: 20px; overflow-y: auto; }
  .panel--brief { background: var(--surface); display: flex; flex-direction: column; gap: 24px; }
  .panel--results { display: flex; flex-direction: column; }

  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
  .panel-block h2 { font-size: 16px; margin-top: 2px; }
  .results-head { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .result-count { font-size: 11.5px; color: var(--ink-muted); background: var(--surface-sunken); padding: 3px 8px; border-radius: 999px; }
  .hint { font-size: 12px; color: var(--ink-muted); }
  .hint--warn { color: var(--mid); }
  .field-note { font-size: 12px; color: var(--ink-faint); }

  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted); }
  .chip--preset { transition: 0.15s; }
  .chip--preset:hover { border-color: var(--brand); color: var(--brand); }
  .chip--active { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-strong); font-weight: 500; }
  .chip--matched { background: var(--good-bg); border-color: transparent; color: #1e6b45; }
  .chip--missing { background: var(--bad-bg); border-color: transparent; color: #8f342e; text-decoration: line-through; }
  .chip--muted { background: var(--surface-sunken); border-color: transparent; }

  textarea.jd { width: 100%; resize: vertical; min-height: 170px; border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; font-size: 13px; line-height: 1.6; background: var(--surface); color: var(--ink); font-family: var(--font-body); }
  textarea.jd:focus { outline: none; border-color: var(--brand); }

  .dropzone { border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 22px 14px; text-align: center; background: var(--surface-sunken); transition: 0.15s; }
  .dropzone:hover, .dropzone--active { border-color: var(--brand); background: var(--brand-tint); }
  .dropzone__title { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .dropzone__sub { font-size: 11.5px; color: var(--ink-muted); }

  .file-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .file-list li { display: flex; align-items: center; gap: 8px; padding: 7px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
  .file-list__name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-list__remove { border: none; background: none; color: var(--ink-faint); font-size: 15px; }
  .file-list__remove:hover { color: var(--bad); }

  .run-button { margin-top: auto; border: none; border-radius: 10px; background: var(--brand); color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 14px; padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .run-button:hover:not(:disabled) { background: var(--brand-strong); }
  .run-button:disabled { background: var(--surface-sunken); color: var(--ink-faint); cursor: not-allowed; }

  .candidate-list { display: flex; flex-direction: column; gap: 8px; }
  .inline-warning { font-size: 12px; color: #8f342e; background: var(--bad-bg); border-radius: 6px; padding: 9px 11px; }

  .candidate-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 10px; padding: 11px 13px; }
  .candidate-row:hover { border-color: var(--border-strong); }
  .candidate-row--good { border-left-color: var(--good); }
  .candidate-row--mid { border-left-color: var(--mid); }
  .candidate-row--bad { border-left-color: var(--bad); }
  .candidate-row--active { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .candidate-row__rank { font-size: 11.5px; color: var(--ink-faint); width: 18px; }
  .candidate-row__avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-tint); color: var(--brand-strong); font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .candidate-row__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .candidate-row__name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .candidate-row__meta { font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .candidate-row__skills { display: none; gap: 6px; margin-left: auto; }
  @media (min-width: 880px) { .candidate-row__skills { display: flex; } }

  .score-ring { position: relative; display: inline-flex; align-items: center; justify-content: center; margin-left: 8px; flex-shrink: 0; }
  .score-ring svg { position: absolute; inset: 0; }
  .score-ring__arc { transition: stroke-dashoffset 0.6s ease; }
  .score-ring__value { font-weight: 600; }

  .empty-state { margin: auto; max-width: 300px; text-align: center; padding: 30px 16px; color: var(--ink-muted); }
  .empty-state__mark { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface-sunken); font-size: 15px; margin-bottom: 10px; color: var(--ink-faint); }
  .empty-state h3 { font-size: 14px; margin-bottom: 6px; color: var(--ink); }
  .empty-state p { font-size: 12.5px; }
  .empty-state--error .empty-state__mark { background: var(--bad-bg); color: var(--bad); }
  .spin { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .detail-panel { background: var(--surface); padding: 20px; position: relative; display: flex; flex-direction: column; gap: 18px; }
  .detail-panel--empty { align-items: center; justify-content: center; color: var(--ink-muted); font-size: 12.5px; text-align: center; }
  .detail-panel__close { position: absolute; top: 14px; right: 14px; border: none; background: var(--surface-sunken); width: 26px; height: 26px; border-radius: 50%; font-size: 15px; color: var(--ink-muted); }
  .detail-panel__head { display: flex; align-items: center; gap: 14px; padding-right: 28px; }
  .detail-panel__head h2 { font-size: 17px; margin-top: 4px; }
  .detail-panel__email { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; }
  .badge--good { background: var(--good-bg); color: #1e6b45; }
  .badge--mid { background: var(--mid-bg); color: #8a6408; }
  .badge--bad { background: var(--bad-bg); color: #8f342e; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0; padding: 13px; background: var(--surface-sunken); border-radius: 10px; }
  .detail-grid dt { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 3px; }
  .detail-grid dd { margin: 0; font-size: 12.5px; }
  .detail-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); margin-bottom: 8px; }
  .detail-section p { font-size: 13px; line-height: 1.6; margin: 0; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-list { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>

<div id="root"></div>

<!--
  ====== YOUR ACTUAL APP CODE ======
  This is normal React code (JSX). The only difference from a "real"
  React project is that there's no build step — Babel (loaded above)
  translates this in your browser, on the fly, every time the page loads.
-->
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// -----------------------------------------------------------------
// CHANGE THIS if your backend isn't running on localhost:8000
// (e.g. after you deploy it, put your Render/Railway URL here instead)
// -----------------------------------------------------------------
const API_URL = "http://localhost:8000";

// ---------- small helpers ----------

function scoreBand(score) {
  if (score >= 75) return "good";
  if (score >= 50) return "mid";
  return "bad";
}

function initials(name) {
  if (!name) return "?";
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]?.toUpperCase()).join("");
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

async function parseError(res) {
  try {
    const body = await res.json();
    return body.detail || `Request failed (${res.status})`;
  } catch {
    return `Request failed (${res.status})`;
  }
}

async function fetchJobDescriptions() {
  const res = await fetch(`${API_URL}/api/job-descriptions`);
  if (!res.ok) throw new Error(await parseError(res));
  return res.json();
}

async function screenResumes({ jobDescription, files }) {
  const form = new FormData();
  form.append("job_description", jobDescription);
  files.forEach(file => form.append("resumes", file));
  const res = await fetch(`${API_URL}/api/screen`, { method: "POST", body: form });
  if (!res.ok) throw new Error(await parseError(res));
  return res.json();
}

// ---------- ScoreRing ----------

function ScoreRing({ score = 0, size = 56, stroke = 5 }) {
  const clamped = Math.max(0, Math.min(100, score));
  const band = scoreBand(clamped);
  const color = { good: "var(--good)", mid: "var(--mid)", bad: "var(--bad)" }[band];
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference * (1 - clamped / 100);

  return (
    <div className="score-ring" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="var(--border)" strokeWidth={stroke} />
        <circle
          cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={color} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset}
          transform={`rotate(-90 ${size / 2} ${size / 2})`} className="score-ring__arc"
        />
      </svg>
      <span className="score-ring__value mono" style={{ fontSize: size * 0.28 }}>{clamped}</span>
    </div>
  );
}

// ---------- Job description panel ----------

function JobDescriptionPanel({ presets, presetsLoading, presetsError, selectedPresetId, onSelectPreset, jobDescription, onChangeJobDescription }) {
  return (
    <section className="panel-block">
      <span className="eyebrow">01 — Brief</span>
      <h2>Job description</h2>

      {presetsError && <p className="hint hint--warn">Couldn't load sample briefs ({presetsError}). Paste one below instead.</p>}

      {!presetsError && (
        <div className="preset-row">
          {presetsLoading && <span className="hint">Loading…</span>}
          {!presetsLoading && presets.map(p => (
            <button key={p.id} type="button"
              className={`chip chip--preset ${selectedPresetId === p.id ? "chip--active" : ""}`}
              onClick={() => onSelectPreset(p)}>
              {p.title}
            </button>
          ))}
          {!presetsLoading && presets.length === 0 && <span className="hint">No sample briefs found — write your own below.</span>}
        </div>
      )}

      <textarea
        className="jd"
        placeholder="Paste the job description here, or pick a sample brief above…"
        value={jobDescription}
        onChange={e => onChangeJobDescription(e.target.value)}
        rows={10}
      />
      <p className="field-note" style={{ marginTop: 6 }}>
        {jobDescription.trim() ? `${jobDescription.trim().split(/\s+/).length} words` : "Required before you can run screening."}
      </p>
    </section>
  );
}

// ---------- Resume upload ----------

const ACCEPTED = [".pdf", ".docx"];
function isAccepted(file) { return ACCEPTED.some(ext => file.name.toLowerCase().endsWith(ext)); }

function ResumeUpload({ files, onChangeFiles }) {
  const inputRef = useRef(null);
  const [dragActive, setDragActive] = useState(false);
  const [rejected, setRejected] = useState([]);

  function addFiles(incoming) {
    const accepted = [], bad = [];
    Array.from(incoming).forEach(f => (isAccepted(f) ? accepted : bad).push(isAccepted(f) ? f : f.name));
    setRejected(bad);
    if (accepted.length) {
      const seen = new Set(files.map(f => `${f.name}:${f.size}`));
      const merged = [...files];
      accepted.forEach(f => {
        const key = `${f.name}:${f.size}`;
        if (!seen.has(key)) { merged.push(f); seen.add(key); }
      });
      onChangeFiles(merged);
    }
  }

  return (
    <section className="panel-block">
      <span className="eyebrow">02 — Candidates</span>
      <h2>Resumes</h2>

      <div
        className={`dropzone ${dragActive ? "dropzone--active" : ""}`}
        style={{ marginTop: 10 }}
        onDragOver={e => { e.preventDefault(); setDragActive(true); }}
        onDragLeave={() => setDragActive(false)}
        onDrop={e => { e.preventDefault(); setDragActive(false); addFiles(e.dataTransfer.files); }}
        onClick={() => inputRef.current?.click()}
      >
        <p className="dropzone__title">Drop resumes here, or click to browse</p>
        <p className="dropzone__sub">PDF or DOCX · multiple files supported</p>
        <input ref={inputRef} type="file" multiple accept=".pdf,.docx" hidden
          onChange={e => { addFiles(e.target.files); e.target.value = ""; }} />
      </div>

      {rejected.length > 0 && (
        <p className="hint hint--warn">Skipped {rejected.length} file(s) — only .pdf and .docx are supported.</p>
      )}

      {files.length > 0 && (
        <ul className="file-list">
          {files.map(f => (
            <li key={f.name + f.size}>
              <span className="file-list__name">{f.name}</span>
              <span className="mono field-note">{formatSize(f.size)}</span>
              <button type="button" className="file-list__remove"
                onClick={() => onChangeFiles(files.filter(x => x.name !== f.name))}>×</button>
            </li>
          ))}
        </ul>
      )}

      {files.length === 0 && <p className="field-note" style={{ marginTop: 8 }}>Add at least one resume to continue.</p>}
    </section>
  );
}

// ---------- Candidate list ----------

function CandidateList({ status, error, results, errors, onSelect, selectedId }) {
  if (status === "idle") return (
    <div className="empty-state">
      <span className="empty-state__mark">+</span>
      <h3>No candidates ranked yet</h3>
      <p>Add a job description and at least one resume, then run screening.</p>
    </div>
  );

  if (status === "loading") return (
    <div className="empty-state">
      <span className="empty-state__mark spin">◐</span>
      <h3>Reading resumes and scoring…</h3>
      <p>This calls the AI once per resume, so larger batches take longer.</p>
    </div>
  );

  if (status === "error") return (
    <div className="empty-state empty-state--error">
      <span className="empty-state__mark">!</span>
      <h3>Screening failed</h3>
      <p>{error}</p>
    </div>
  );

  return (
    <div className="candidate-list">
      {errors && errors.length > 0 && (
        <div className="inline-warning">
          {errors.length} file(s) couldn't be processed: {errors.map(e => e.filename).join(", ")}.
        </div>
      )}

      {results.map((c, i) => (
        <button key={c.id} type="button"
          className={`candidate-row candidate-row--${scoreBand(c.score)} ${selectedId === c.id ? "candidate-row--active" : ""}`}
          onClick={() => onSelect(c)}>
          <span className="candidate-row__rank mono">{String(i + 1).padStart(2, "0")}</span>
          <span className="candidate-row__avatar">{initials(c.name)}</span>
          <span className="candidate-row__main">
            <span className="candidate-row__name">{c.name || "Unnamed candidate"}</span>
            <span className="candidate-row__meta">
              {c.email || "No email found"}{c.years_of_experience != null ? ` · ${c.years_of_experience} yrs exp` : ""}
            </span>
          </span>
          <span className="candidate-row__skills">
            {c.matched_skills.slice(0, 3).map(s => <span key={s} className="chip chip--matched">{s}</span>)}
            {c.matched_skills.length > 3 && <span className="chip chip--muted">+{c.matched_skills.length - 3}</span>}
          </span>
          <ScoreRing score={c.score} />
        </button>
      ))}

      {results.length === 0 && (
        <div className="empty-state">
          <span className="empty-state__mark">·</span>
          <h3>No candidates scored</h3>
          <p>Every uploaded file failed to process — check the warning above.</p>
        </div>
      )}
    </div>
  );
}

// ---------- Candidate detail ----------

function CandidateDetail({ candidate, onClose }) {
  if (!candidate) return (
    <aside className="detail-panel detail-panel--empty">
      <p>Select a candidate from the ranked list to see the full breakdown.</p>
    </aside>
  );

  const band = scoreBand(candidate.score);
  const label = { good: "Strong match", mid: "Partial match", bad: "Weak match" }[band];

  return (
    <aside className="detail-panel">
      <button type="button" className="detail-panel__close" onClick={onClose}>×</button>
      <div className="detail-panel__head">
        <ScoreRing score={candidate.score} size={80} stroke={7} />
        <div>
          <span className={`badge badge--${band}`}>{label}</span>
          <h2>{candidate.name || "Unnamed candidate"}</h2>
          <p className="detail-panel__email mono">{candidate.email || "No email found"}</p>
        </div>
      </div>

      <dl className="detail-grid">
        <div><dt>Experience</dt><dd>{candidate.years_of_experience != null ? `${candidate.years_of_experience} years` : "Not stated"}</dd></div>
        <div><dt>Education</dt><dd>{candidate.education || "Not stated"}</dd></div>
        <div><dt>Source file</dt><dd className="mono">{candidate.filename}</dd></div>
      </dl>

      <section className="detail-section">
        <h3>Summary</h3>
        <p>{candidate.summary || "No summary returned."}</p>
      </section>

      <section className="detail-section">
        <h3>Matched skills ({candidate.matched_skills.length})</h3>
        <div className="chip-row">
          {candidate.matched_skills.length > 0
            ? candidate.matched_skills.map(s => <span key={s} className="chip chip--matched">{s}</span>)
            : <span className="field-note">None of the required skills were found.</span>}
        </div>
      </section>

      <section className="detail-section">
        <h3>Missing skills ({candidate.missing_skills.length})</h3>
        <div className="chip-row">
          {candidate.missing_skills.length > 0
            ? candidate.missing_skills.map(s => <span key={s} className="chip chip--missing">{s}</span>)
            : <span className="field-note">No gaps against the brief.</span>}
        </div>
      </section>

      {candidate.skills?.length > 0 && (
        <section className="detail-section">
          <h3>All extracted skills</h3>
          <div className="chip-row">{candidate.skills.map(s => <span key={s} className="chip chip--muted">{s}</span>)}</div>
        </section>
      )}

      {candidate.projects?.length > 0 && (
        <section className="detail-section">
          <h3>Projects</h3>
          <ul className="detail-list">{candidate.projects.map(p => <li key={p}>{p}</li>)}</ul>
        </section>
      )}
    </aside>
  );
}

// ---------- Main App ----------

function App() {
  const [presets, setPresets] = useState([]);
  const [presetsLoading, setPresetsLoading] = useState(true);
  const [presetsError, setPresetsError] = useState(null);
  const [selectedPresetId, setSelectedPresetId] = useState(null);

  const [jobDescription, setJobDescription] = useState("");
  const [files, setFiles] = useState([]);

  const [status, setStatus] = useState("idle");
  const [runError, setRunError] = useState(null);
  const [results, setResults] = useState([]);
  const [fileErrors, setFileErrors] = useState([]);
  const [selectedCandidate, setSelectedCandidate] = useState(null);

  useEffect(() => {
    fetchJobDescriptions()
      .then(setPresets)
      .catch(err => setPresetsError(err.message))
      .finally(() => setPresetsLoading(false));
  }, []);

  function handleSelectPreset(preset) {
    setSelectedPresetId(preset.id);
    setJobDescription(preset.content);
  }

  const canRun = jobDescription.trim().length > 0 && files.length > 0 && status !== "loading";

  async function handleRun() {
    if (!canRun) return;
    setStatus("loading");
    setRunError(null);
    setSelectedCandidate(null);
    try {
      const data = await screenResumes({ jobDescription, files });
      setResults(data.results || []);
      setFileErrors(data.errors || []);
      setStatus("success");
    } catch (err) {
      setRunError(err.message || "Something went wrong.");
      setStatus("error");
    }
  }

  return (
    <div className="app-shell">
      <header className="topbar">
        <span className="topbar__mark"></span>
        <h1>Resume Screener</h1>
        <p className="topbar__tag">Paste a brief, drop in resumes, get a ranked shortlist.</p>
      </header>

      <main className="workspace">
        <aside className="panel panel--brief">
          <JobDescriptionPanel
            presets={presets} presetsLoading={presetsLoading} presetsError={presetsError}
            selectedPresetId={selectedPresetId} onSelectPreset={handleSelectPreset}
            jobDescription={jobDescription} onChangeJobDescription={v => { setSelectedPresetId(null); setJobDescription(v); }}
          />
          <ResumeUpload files={files} onChangeFiles={setFiles} />
          <button type="button" className="run-button" disabled={!canRun} onClick={handleRun}>
            {status === "loading" ? "Screening…" : "Screen candidates"} <span>→</span>
          </button>
        </aside>

        <section className="panel panel--results">
          <div className="results-head">
            <div><span className="eyebrow">03 — Ranking</span><h2>Candidates</h2></div>
            {status === "success" && <span className="result-count mono">{results.length} scored</span>}
          </div>
          <CandidateList status={status} error={runError} results={results} errors={fileErrors}
            onSelect={setSelectedCandidate} selectedId={selectedCandidate?.id} />
        </section>

        <CandidateDetail candidate={selectedCandidate} onClose={() => setSelectedCandidate(null)} />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
